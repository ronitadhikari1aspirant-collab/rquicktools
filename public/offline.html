<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — QuickTools</title>
<link rel="icon" href="/icons/icon-192.png" />
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family: system-ui, sans-serif; background:#fff; color:#172554; padding:24px; box-sizing:border-box; }
  @media (prefers-color-scheme: dark) { body { background:#0f172a; color:#e2e8f0; } .card { background:#1e293b !important; border-color:#334155 !important; } p { color:#94a3b8 !important; } }
  .card { max-width:420px; text-align:center; border:1px solid #e2e8f0; border-radius:16px; padding:32px; }
  img { width:56px; height:56px; border-radius:12px; }
  h1 { font-size:22px; margin:16px 0 8px; }
  p { color:#64748b; line-height:1.5; margin:0 0 20px; }
  button { background:#2563eb; color:#fff; border:0; border-radius:10px; padding:10px 18px; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="QuickTools" />
    <h1>You're offline</h1>
    <p>This page isn't saved on your device yet. Pages you've already opened in QuickTools will still work. Reconnect to load everything else.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
